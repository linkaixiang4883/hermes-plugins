name: agnes-video
version: 1.3.0
description: "Agnes AI 视频生成后端 —— 一个插件两个 provider：agnes-video（国际站 apihub.agnes-ai.com，AGNES_API_KEY）与 agnes-cn-video（国内站 api.agnes-ai.cn，AGNES_CN_API_KEY）。agnes-video-2.5 / 2.5-flash。文生视频、图生视频、关键帧动画，走异步任务 API（POST /v1/videos + GET /agnesapi 轮询），完成后取回并缓存视频文件。"
author: user
kind: backend
requires_env:
  - AGNES_API_KEY
  - AGNES_CN_API_KEY
# 依赖面实测（2026-10-17）：agent.image_gen_provider / agent.video_gen_provider /
# providers.register_provider 与 ctx.register_{image,video}_gen_provider 在 v0.21.6 上
# 逐一存在性验证通过（v0.21.6 = 本仓最早的正式 release tag）。全量端到端实测：v0.22.2。
requires_hermes: ">=0.21.6"
